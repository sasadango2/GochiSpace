<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    
    <!-- ファビコン設定 -->
    <link rel="icon" href="%PUBLIC_URL%/gochiSpaceFavicon.ico" />
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/gochiSpaceFavicon.ico" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/gochiSpaceFavicon.ico" />
    
    <!-- モバイル最適化メタタグ -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FF5722" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GochiSpace" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- SEO・説明 -->
    <meta name="description" content="GochiSpace - 美味しい発見をシェアしよう。レストランレビューとグルメ情報をシェアするモバイルアプリ" />
    <meta name="keywords" content="レストラン,レビュー,グルメ,食事,評価,おすすめ" />
    <meta name="author" content="GochiSpace" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/gochispaceAppIcon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/gochispaceAppIcon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>GochiSpace</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    
    <!-- PWA Service Worker 登録 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('📱 Service Worker 登録成功:', registration.scope);
            }, function(err) {
              console.log('❌ Service Worker 登録失敗:', err);
            });
        });
      }
      
      // モバイル最適化: ビューポート高さ調整
      function setVH() {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }
      
      // 初回設定とリサイズ時の調整
      setVH();
      window.addEventListener('resize', setVH);
      window.addEventListener('orientationchange', setVH);
      
      // タッチイベント最適化
      document.addEventListener('touchstart', function(){}, {passive: true});
    </script>
  </body>
</html>
